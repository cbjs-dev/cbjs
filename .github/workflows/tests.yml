name: Tests
on:
  workflow_dispatch:
    inputs:
      couchbase-server-version:
        description: 'Couchbase Server version to test against'
        type: choice
        required: false
        default: 'all'
        options:
          - 'all'
          - 'enterprise-7.2.4'
          - 'enterprise-7.6.4'
          - 'enterprise-8.0.0'
  push:
    branches:
      - main
  issue_comment:
    types: [created]

jobs:
  # Tests are skipped only when *every* commit since the last run that actually
  # executed them is a docs commit. Looking at the head commit alone would skip a
  # push whose last commit is `docs(…)` but which also carries code changes.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commits since the last run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          decide() {
            echo "$2"
            echo "should-run=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if grep -qF 'skip ci' <<< "$HEAD_COMMIT_MESSAGE"; then
            decide false "Head commit asks to skip CI."
          fi

          # Base = the commit tested by the most recent run of this workflow on this
          # branch that actually ran. Runs that were skipped or cancelled have a
          # conclusion of `skipped`/`cancelled`, the current run has none yet.
          base="$(gh run list \
            --workflow tests.yml \
            --branch "$BRANCH" \
            --limit 50 \
            --json headSha,conclusion \
            --jq 'map(select(.conclusion == "success" or .conclusion == "failure")) | .[0].headSha // empty')"

          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # No known previous run, or its commit is gone (force push): fall back
            # to the range of this push.
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            decide true "No usable base commit."
          fi

          subjects="$(git log --format=%s "${base}..${HEAD_SHA}")"

          if [[ -z "$subjects" ]]; then
            decide true "No new commit since ${base}."
          fi

          echo "Commits since ${base}:"
          echo "$subjects"

          while IFS= read -r subject; do
            if [[ "$subject" != docs* ]]; then
              decide true "Non-docs commit found: ${subject}"
            fi
          done <<< "$subjects"

          decide false "Every commit since ${base} is a docs commit."

  test:
    needs: [check]
    if: >
      always() &&
      ((github.event_name == 'push' && needs.check.outputs.should-run == 'true') ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/test') && github.actor == 'JesusTheHun') ||
      github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    runs-on:
      labels: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        couchbase-server-version: ${{ github.event_name == 'workflow_dispatch' && inputs.couchbase-server-version != 'all' && fromJSON(format('["{0}"]', inputs.couchbase-server-version)) || fromJSON('["enterprise-7.2.4","enterprise-7.6.4","enterprise-8.0.0"]') }}
    services:
      couchbase:
        image: couchbase:${{ matrix.couchbase-server-version }}
        ports:
          - 8091:8091
          - 8092:8092
          - 8093:8093
          - 8094:8094
          - 8095:8095
          - 8096:8096
          - 8097:8097
          - 9102:9102
          - 18091:18091
          - 18092:18092
          - 18093:18093
          - 18094:18094
          - 18095:18095
          - 18096:18096
          - 18097:18097
          - 19102:19102
          - 9123:9123
          - 11210:11210
          - 11280:11280
    env:
      CB_CONNECTION_STRING: couchbase://127.0.0.1
      CB_USER: Administrator
      CB_PASSWORD: password
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i

      - name: Build packages
        run: pnpm run build

      - name: Initialize Couchbase cluster
        run: pnpm dlx tsx tests/scripts/initTestCluster.ts

      - name: Restore vitest cache
        uses: actions/cache/restore@v5
        with:
          path: ./node_modules/.vite/results.json
          key: vitest-cache-${{ matrix.couchbase-server-version }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vitest-cache-${{ matrix.couchbase-server-version }}-${{ github.ref_name }}-
            vitest-cache-${{ matrix.couchbase-server-version }}-main-

      - name: Run all tests
        run: pnpm vitest --run --bail 5

      # A vitest worker dying is reported as `[vitest-pool]: Worker forks emitted error`,
      # without the exit code nor the signal. A segfault of the native addon and a kernel
      # OOM kill both look the same from vitest, but not from the kernel ring buffer.
      - name: Diagnose worker deaths
        if: always()
        run: |
          echo "::group::kernel ring buffer"
          sudo dmesg -T | tail -300 || true
          echo "::endgroup::"
          echo "::group::memory"
          free -m || true
          echo "::endgroup::"
          echo "::group::core dumps"
          cat /proc/sys/kernel/core_pattern || true
          ls -la /var/lib/systemd/coredump 2>/dev/null || true
          coredumpctl list --no-pager 2>/dev/null || true
          echo "::endgroup::"

      - name: Save vitest cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ./node_modules/.vite/results.json
          key: vitest-cache-${{ matrix.couchbase-server-version }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Tests Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-report-${{ matrix.couchbase-server-version }}-${{ github.sha }}
          path: tests-report
          overwrite: true

      - name: Upload Tests Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-logs-${{ matrix.couchbase-server-version }}-${{ github.sha }}
          path: vitest-pino.log
          overwrite: true